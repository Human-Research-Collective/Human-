<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>secret | Human Research Collective</title>
  <link rel="stylesheet" href="style.css?v=3" />
  <style>
    .secret {
      max-width: 640px;
      margin: 0 auto;
      padding: 40px 0 24px;
      text-align: center;
    }
    .secret__eyebrow {
      font-size: 12px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }
    .secret__mark { font-size: 56px; margin: 22px 0 6px; }
    .secret__title {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 20px;
    }
    .secret__body p {
      font-size: 16.5px;
      color: var(--text);
      margin: 14px 0;
      line-height: 1.85;
    }
    .secret__quote {
      margin: 32px auto;
      padding: 4px 0;
      font-size: 18px;
      color: var(--cat);
      font-weight: 700;
    }
    .secret__back {
      display: inline-block;
      margin-top: 28px;
      font-size: 14px;
      color: var(--muted);
    }
    .secret__back:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="secret">
      <div class="secret__eyebrow">SECRET</div>
      <div class="secret__mark">🤫</div>
      <h1 class="secret__title">ようこそ、隠しページへ。</h1>
      <div class="secret__body">
        <p>このページは、どこからもリンクされていません。<br />URL を知っている人だけが、ここにたどり着けます。</p>
        <p>あなたは「Human?」を探求する仲間です。</p>
      </div>
      <div class="secret__quote">— 一緒に人間とは何か、考えませんか。</div>
      <a href="./" class="secret__back">← ブログ一覧へ戻る</a>
    </section>
  </div>
  <footer class="site-footer">
    <div class="site-footer__inner">
      <span>© 2026 Human Research Collective</span>
      <div class="social">
        <a href="https://humanresearchcollective.substack.com/" target="_blank" rel="noopener">Substack</a>
        <a href="https://hrc.theshop.jp/" target="_blank" rel="noopener">STORE</a>
      </div>
    </div>
  </footer>
</body>
</html>
